# говорим, что используем репозиторий с хуками ruff
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # версия ruff
    rev: v0.4.4
    hooks:
      # первый хук: ищет ошибки в коде (неиспользуемые импорты, синтаксис и т.д.)
      - id: ruff
        args: [ --fix ] # аргумент --fix значит "попробуй исправить сам"
      
      # второй хук: форматирует код (делает красивые отступы, переносы строк)
      - id: ruff-format